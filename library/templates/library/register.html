{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block main_class %}auth{% endblock %}
{% block content %}
<div class="card auth-card wide-card">
  <h1>Create your library account</h1>
  <p class="muted">Your Student / Member ID becomes your login.</p>
  <form method="post" class="form grid-form">
    {% csrf_token %}
    {{ form }}
    <button class="btn wide">Register</button>
  </form>
  <p class="links">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
