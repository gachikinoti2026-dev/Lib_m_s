{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block main_class %}auth{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Check your email</h1>
  <p class="muted">If an account uses that address, a reset link is on its way. Check your inbox and spam folder.</p>
  <p class="links"><a href="{% url 'login' %}">Back to log in</a></p>
</div>
{% endblock %}
