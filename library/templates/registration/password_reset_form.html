{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block main_class %}auth{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Reset password</h1>
  <p class="muted">Enter your account email and we'll send you a reset link.</p>
  <form method="post" class="form">{% csrf_token %}{{ form }}<button class="btn wide">Send reset link</button></form>
  <p class="links"><a href="{% url 'login' %}">Back to log in</a></p>
</div>
{% endblock %}
