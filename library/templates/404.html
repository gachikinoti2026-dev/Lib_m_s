{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block main_class %}auth{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Page not found</h1>
  <p class="muted">That page doesn't exist or has moved. Check the address, or head back to the library.</p>
  <a class="btn wide" href="{% if user.is_staff %}{% url 'dashboard' %}{% else %}{% url 'home' %}{% endif %}">Back to the library</a>
</div>
{% endblock %}
