{% extends 'base.html' %}

{% block title %}Pending Returns{% endblock %}

{% block content %}
<h2>Pending Returns</h2>

<table border="1">
    <tr>
        <th>Member</th>
        <th>Book</th>
        <th>Borrow Date</th>
        <th>Due Date</th>
    </tr>

    {% for item in pending %}
    <tr>
        <td>{{ item.member }}</td>
        <td>{{ item.book }}</td>
        <td>{{ item.borrow_date }}</td>
        <td>{{ item.due_date }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
