{% extends 'base.html' %}

{% block title %}Unpaid Debts{% endblock %}

{% block content %}
<h2>Unpaid Debts</h2>

<table border="1">
    <tr>
        <th>Member</th>
        <th>Amount Due</th>
    </tr>

    {% for debt in debts %}
    <tr>
        <td>{{ debt.member }}</td>
        <td>{{ debt.amount }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
