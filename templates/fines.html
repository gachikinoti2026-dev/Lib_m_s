{% extends 'base.html' %}

{% block title %}Fines{% endblock %}

{% block content %}
<h2>Library Fines</h2>

<table border="1">
    <tr>
        <th>Member</th>
        <th>Book</th>
        <th>Days Late</th>
        <th>Fine Amount</th>
    </tr>

    {% for fine in fines %}
    <tr>
        <td>{{ fine.member }}</td>
        <td>{{ fine.book }}</td>
        <td>{{ fine.days_late }}</td>
        <td>{{ fine.amount }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
