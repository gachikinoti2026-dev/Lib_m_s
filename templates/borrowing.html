{% extends 'base.html' %}

{% block title %}Borrow Book{% endblock %}

{% block content %}
<h2>Borrow Book</h2>

<form method="POST">
    {% csrf_token %}

    <label>Member ID</label><br>
    <input type="text" name="member_id"><br><br>

    <label>Book ID</label><br>
    <input type="text" name="book_id"><br><br>

    <label>Borrow Date</label><br>
    <input type="date" name="borrow_date"><br><br>

    <label>Return Date</label><br>
    <input type="date" name="return_date"><br><br>

    <button type="submit">Borrow Book</button>
</form>
{% endblock %}
